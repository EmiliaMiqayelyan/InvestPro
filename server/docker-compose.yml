services:
  mysql:
    image: mysql:8.0
    container_name: investpro-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: investpro
      MYSQL_USER: invest
      MYSQL_PASSWORD: invest
    ports:
      - "3306:3306"
    volumes:
      - investpro_mysql_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uinvest", "-pinvest"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  investpro_mysql_data:
